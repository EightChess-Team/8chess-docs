[project]
site_url = "https://eightchess-team.github.io/8chess-docs/"
site_name = "8Chess Docs"
site_description = "Documentation, technical details, and frequent questions for the 8Chess chess engine."
site_author = "8Chess Team"
copyright = "Copyright &copy; 2026 8Chess Team"

repo_url = "https://github.com/EightChess-Team/8chess-docs"
repo_name = "EightChess-Team/8chess-docs"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "8Chess" = [
    { "Home" = "8chess/index.md" },
    { "Download and usage" = "8chess/download-and-usage.md" },
    { "Compiling from source" = "8chess/compiling-from-source.md" },
    { "UCI protocol and 8Chess commands" = "8chess/uci-protocol-and-commands.md" },
    { "Advanced topics" = "8chess/advanced-topics.md" },
    { "Regression tests" = "8chess/regression-tests.md" },
    { "Terminology" = "8chess/terminology.md" },
    { "FAQ" = "8chess/faq.md" },
    { "Developers" = "8chess/developers.md" },
    { "Useful data" = "8chess/useful-data.md" },
  ]},
  { "8chesstest" = [
    { "Home" = "8chesstest/index.md" },
    { "Creating my first test" = "8chesstest/creating-a-test.md" },
    { "Running the worker" = "8chesstest/running-the-worker.md" },
    { "PGN files" = "8chesstest/pgn-files.md" },
    { "FAQ" = "8chesstest/faq.md" },
  ]},
  { "NNUE training" = [
    { "Home" = "nnue/index.md" },
    { "Network format" = "nnue/network-format.md" },
    { "Training pipeline" = "nnue/training.md" },
  ]},
  { "Opening books" = [
    { "Home" = "books/index.md" },
    { "Opening suites" = "books/opening-suites.md" },
  ]},
]

extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
favicon = "assets/images/favicon.png"
logo = "assets/images/logo.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/EightChess-Team/8chess"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
